<div class="form-grid"><label>Platform<select name="platform_id" required>{% for p in platforms %}<option value="{{ p.id }}" {% if a and a.platform_id == p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></label><label>Display name<input name="display_name" value="{{ a.display_name if a else '' }}" required></label><label>Handle<input name="handle" value="{{ a.handle if a else '' }}" placeholder="@username" required></label><label>Profile URL (optional)<input type="url" name="profile_url" value="{{ a.profile_url if a else '' }}" placeholder="https://…"></label></div><label class="check"><input type="checkbox" name="active" {% if not a or a.active %}checked{% endif %}>Active account</label>

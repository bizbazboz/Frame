<div class="campaign-image-field" data-campaign-image>
<a data-campaign-image-workspace target="_blank" rel="noopener" aria-label="Open image in photo workspace" {% if selected_version %}href="{{ url_for('group',id=selected_version.group_id,version_id=selected_version.id) }}"{% else %}hidden{% endif %}><img class="campaign-image-thumb" {% if selected_version %}src="{{ url_for('image_preview',version_id=selected_version.id,variant='thumb') }}"{% else %}hidden{% endif %} alt=""></a>
<label>Image <span data-image-number>{{ loop.index if loop is defined else '' }}</span><select name="version_ids" required data-campaign-image-select><option value="">Choose an image</option>{% for version in available_versions %}<option value="{{ version.id }}" data-workspace="{{ url_for('group',id=version.group_id,version_id=version.id) }}" data-filename="{{ version.original_filename }}" data-thumb="{{ url_for('image_preview',version_id=version.id,variant='thumb') }}" data-full="{{ url_for('image_preview',version_id=version.id,variant='display') }}" {% if selected_version and selected_version.id == version.id %}selected{% endif %}>{{ version.original_filename }} · {{ version.label }} · Group {{ version.group_id }}</option>{% endfor %}</select></label>
<div class="campaign-image-actions"><button type="button" class="icon-button" data-image-up aria-label="Move image up" title="Move up">↑</button><button type="button" class="icon-button" data-image-down aria-label="Move image down" title="Move down">↓</button><button type="button" class="icon-button" data-image-remove aria-label="Remove image" title="Remove">{{ icon('close',16) }}</button></div>
</div>
